<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Codex Test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            text-align: center;
        }
        .hero {
            padding: 100px 20px;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 0.5em;
        }
        p {
            font-size: 1.2em;
            max-width: 600px;
            margin: 0 auto 1.5em;
        }
        .cta {
            display: inline-block;
            padding: 15px 30px;
            background: #fff;
            color: #764ba2;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s, color 0.3s;
        }
        .cta:hover {
            background: #764ba2;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Welcome to Codex</h1>
        <p>This is a playful landing page created just for testing the PR flow.</p>
        <a href="#" class="cta">Learn More</a>
    </div>
</body>
</html>
